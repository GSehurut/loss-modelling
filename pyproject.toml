[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "loss-modelling"
version = "0.1.0"
description = "Claims development triangles, chain ladder and Mack reserve uncertainty in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goabaone Sehurutshe" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["actuarial", "reserving", "chain ladder", "mack", "insurance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
examples = ["jupyter", "matplotlib"]

[project.urls]
Homepage = "https://github.com/GSehurut/loss-modelling"
Issues = "https://github.com/GSehurut/loss-modelling/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loss_modelling"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
